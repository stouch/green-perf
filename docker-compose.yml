services:
  ch_server:
    image: yandex/clickhouse-server
    ports:
      # HTTP interface. Override with CLICKHOUSE_HTTP_PORT if 8123 is already used on your machine.
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    volumes:
      - ./data:/var/lib/clickhouse
    networks:
      - ch_ntw

networks:
  ch_ntw: